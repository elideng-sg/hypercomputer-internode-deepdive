<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="700" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="#202124">The serving saturation knee — ResNet-50 fp16, dynamic batch ≤16</text>
  <text x="24" y="47" font-size="12" fill="#5f6368">Source: assets/lab-21/latency_vs_concurrency.txt (node …d7j7). Throughput plateaus while p99 explodes ~100×.</text>

  <!-- knee band -->
  <rect x="300" y="70" width="100" height="180" fill="#fff3e0"/>
  <text x="350" y="64" font-size="11" font-weight="700" fill="#b06000" text-anchor="middle">the knee</text>

  <!-- axes -->
  <line x1="100" y1="70" x2="100" y2="250" stroke="#9aa0a6"/>
  <line x1="600" y1="70" x2="600" y2="250" stroke="#9aa0a6"/>
  <line x1="100" y1="250" x2="600" y2="250" stroke="#9aa0a6"/>

  <!-- left axis: throughput req/s (linear 0..1200) -->
  <g font-size="10" fill="#1a73e8" text-anchor="end">
    <line x1="100" y1="250" x2="600" y2="250" stroke="#eceff1"/><text x="94" y="254">0</text>
    <line x1="100" y1="205" x2="600" y2="205" stroke="#eceff1"/><text x="94" y="209">300</text>
    <line x1="100" y1="160" x2="600" y2="160" stroke="#eceff1"/><text x="94" y="164">600</text>
    <line x1="100" y1="115" x2="600" y2="115" stroke="#eceff1"/><text x="94" y="119">900</text>
    <line x1="100" y1="70"  x2="600" y2="70"  stroke="#eceff1"/><text x="94" y="74">1200</text>
  </g>
  <text x="34" y="160" font-size="12" font-weight="600" fill="#1a73e8" transform="rotate(-90 34 160)" text-anchor="middle">throughput (req/s)</text>

  <!-- right axis: p99 ms (log 10..1000) -->
  <g font-size="10" fill="#c5221f">
    <text x="606" y="239">10</text>
    <text x="606" y="164">100</text>
    <text x="606" y="89">1000</text>
  </g>
  <text x="672" y="160" font-size="12" font-weight="600" fill="#c5221f" transform="rotate(-90 672 160)" text-anchor="middle">p99 latency (ms, log)</text>

  <!-- x axis labels: concurrency -->
  <g font-size="10" fill="#5f6368" text-anchor="middle">
    <text x="100" y="268">1</text><text x="200" y="268">4</text><text x="300" y="268">8</text>
    <text x="400" y="268">16</text><text x="500" y="268">32</text><text x="600" y="268">64</text>
  </g>
  <text x="350" y="288" font-size="12" fill="#5f6368" text-anchor="middle">client concurrency (in-flight requests)</text>

  <!-- throughput line (blue) -->
  <polyline fill="none" stroke="#1a73e8" stroke-width="2.5"
    points="100,233 200,187.9 300,141 400,129.9 500,85.9 600,76"/>
  <g fill="#1a73e8"><circle cx="100" cy="233" r="3"/><circle cx="200" cy="187.9" r="3"/><circle cx="300" cy="141" r="3"/><circle cx="400" cy="129.9" r="3"/><circle cx="500" cy="85.9" r="3"/><circle cx="600" cy="76" r="3"/></g>
  <text x="600" y="70" font-size="10" font-weight="700" fill="#1a73e8" text-anchor="end">~1.16k req/s (plateau)</text>

  <!-- p99 line (red, dashed) -->
  <polyline fill="none" stroke="#c5221f" stroke-width="2.5" stroke-dasharray="5 3"
    points="100,234.7 200,233.1 300,227 400,158.6 500,84.1 600,83.1"/>
  <g fill="#c5221f"><circle cx="100" cy="234.7" r="3"/><circle cx="200" cy="233.1" r="3"/><circle cx="300" cy="227" r="3"/><circle cx="400" cy="158.6" r="3"/><circle cx="500" cy="84.1" r="3"/><circle cx="600" cy="83.1" r="3"/></g>
  <text x="410" y="150" font-size="10" font-weight="700" fill="#c5221f">p99 → ~1 s</text>

  <text x="100" y="312" font-size="11" fill="#5f6368">Left of the knee (≤8 in-flight): throughput scales at flat ~10 ms. Right of it: added load only deepens the queue.</text>
  <text x="100" y="330" font-size="11" font-weight="600" fill="#188038">Yet the GPU was only ~17% busy at p99=1 s — the bottleneck is the serving stack, not the H100 (see scaling.svg).</text>
</svg>

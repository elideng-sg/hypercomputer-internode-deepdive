<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="#202124">Both fabrics fall off — GPUDirect just falls from 12× higher</text>
  <text x="24" y="47" font-size="12" fill="#5f6368">Peak all-reduce busbw, log scale. Source: assets/lab-23/enabled_scaling_curve.csv (TCPXO) · assets/lab-12/scaling_curve.csv (gVNIC).</text>

  <!-- y gridlines: log10 decade 10..1000, y = 250 - (log10(v)-1)*85 -->
  <g font-size="10" fill="#9aa0a6" text-anchor="end">
    <line x1="90" y1="250" x2="600" y2="250" stroke="#eceff1"/><text x="84" y="254">10</text>
    <line x1="90" y1="209.4" x2="600" y2="209.4" stroke="#eceff1"/><text x="84" y="213">30</text>
    <line x1="90" y1="165" x2="600" y2="165" stroke="#eceff1"/><text x="84" y="169">100</text>
    <line x1="90" y1="124.4" x2="600" y2="124.4" stroke="#eceff1"/><text x="84" y="128">300</text>
    <line x1="90" y1="80" x2="600" y2="80" stroke="#eceff1"/><text x="84" y="84">1000</text>
  </g>
  <line x1="90" y1="80" x2="90" y2="250" stroke="#9aa0a6"/>
  <line x1="90" y1="250" x2="600" y2="250" stroke="#9aa0a6"/>
  <text x="34" y="165" font-size="12" fill="#5f6368" transform="rotate(-90 34 165)" text-anchor="middle">peak busbw GB/s (log)</text>

  <!-- the intra-node control: both fabrics agree here (no fabric involved) -->
  <line x1="160" y1="80" x2="160" y2="250" stroke="#dadce0" stroke-dasharray="3 3"/>
  <text x="166" y="94" font-size="10" fill="#9aa0a6">NVLink only — control</text>

  <!-- TCPXO (enabled) -->
  <polyline fill="none" stroke="#1a5490" stroke-width="2.5" points="160,107.5 340,122.4 520,142.5"/>
  <g fill="#1a5490">
    <circle cx="160" cy="107.5" r="4"/><circle cx="340" cy="122.4" r="4"/><circle cx="520" cy="142.5" r="4"/>
  </g>
  <g font-size="11" font-weight="700" fill="#1a5490" text-anchor="middle">
    <text x="160" y="100">475.34</text><text x="340" y="115">316.93</text><text x="520" y="135">184.03</text>
  </g>
  <text x="352" y="105" font-size="10" fill="#1a5490">GPUDirect-TCPXO (8 rails)</text>

  <!-- NCCL_ALGO=Tree at 24 GPUs: the only knob the policy file leaves open -->
  <circle cx="520" cy="139.6" r="6" fill="none" stroke="#188038" stroke-width="1.5"/>
  <text x="534" y="160" font-size="10" fill="#188038">Tree: 199.10 (+8.2%)</text>

  <!-- gVNIC (TCP) -->
  <polyline fill="none" stroke="#8b1a1a" stroke-width="2.5" stroke-dasharray="6 3" points="160,108.3 340,218.1 520,235.1"/>
  <g fill="#8b1a1a">
    <circle cx="160" cy="108.3" r="4"/><circle cx="340" cy="218.1" r="4"/><circle cx="520" cy="235.1" r="4"/>
  </g>
  <g font-size="11" font-weight="700" fill="#8b1a1a" text-anchor="middle">
    <text x="160" y="126">465.43</text><text x="340" y="234">23.70</text><text x="520" y="251">14.95</text>
  </g>
  <text x="352" y="212" font-size="10" fill="#8b1a1a">single gVNIC / TCP sockets</text>

  <!-- the gap -->
  <g stroke="#5f6368" stroke-width="1">
    <line x1="340" y1="126" x2="340" y2="214"/><line x1="336" y1="126" x2="344" y2="126"/><line x1="336" y1="214" x2="344" y2="214"/>
    <line x1="520" y1="146" x2="520" y2="231"/><line x1="516" y1="146" x2="524" y2="146"/><line x1="516" y1="231" x2="524" y2="231"/>
  </g>
  <g font-size="11" font-weight="700" fill="#202124" text-anchor="middle">
    <text x="340" y="174">13.4×</text><text x="520" y="194">12.3×</text>
  </g>

  <!-- x labels -->
  <g font-size="11" fill="#5f6368" text-anchor="middle">
    <text x="160" y="270">8 GPUs / 1 node</text><text x="340" y="270">16 GPUs / 2 nodes</text><text x="520" y="270">24 GPUs / 3 nodes</text>
  </g>

  <text x="90" y="296" font-size="11" fill="#5f6368">16→24 GPUs costs 42% on TCPXO and 37% on gVNIC — the enabled fabric is not flatter, only higher. The 8-GPU rung is intra-node</text>
  <text x="90" y="311" font-size="11" fill="#5f6368">NVLink on both sides (475.34 vs 465.43, 2.1% apart), which is what makes the 13.4× and 12.3× attributable to the fabric.</text>
  <text x="90" y="331" font-size="11" font-weight="600" fill="#1a73e8">Sizing a 3-node job from lab-22's single 16-GPU number would over-predict it by ~72%.</text>
</svg>

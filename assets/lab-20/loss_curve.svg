<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="#202124">Real DDP training loss — 16 GPUs / 2 nodes, learnable data from GCS</text>
  <text x="24" y="47" font-size="12" fill="#5f6368">MSE loss, log scale. 4000 steps in 165.8 s, ~3.2 M samples/s. Source: assets/lab-20/training_log.txt (nodes …d7j7 + …lq6m)</text>

  <!-- y gridlines (decades) -->
  <g font-size="10" fill="#9aa0a6">
    <line x1="90" y1="70"  x2="620" y2="70"  stroke="#eceff1"/><text x="52" y="74">1000</text>
    <line x1="90" y1="100" x2="620" y2="100" stroke="#eceff1"/><text x="58" y="104">100</text>
    <line x1="90" y1="130" x2="620" y2="130" stroke="#eceff1"/><text x="64" y="134">10</text>
    <line x1="90" y1="160" x2="620" y2="160" stroke="#eceff1"/><text x="70" y="164">1</text>
    <line x1="90" y1="190" x2="620" y2="190" stroke="#eceff1"/><text x="58" y="194">0.1</text>
    <line x1="90" y1="220" x2="620" y2="220" stroke="#eceff1"/><text x="52" y="224">0.01</text>
    <line x1="90" y1="250" x2="620" y2="250" stroke="#eceff1"/><text x="46" y="254">0.001</text>
  </g>
  <!-- axes -->
  <line x1="90" y1="70" x2="90" y2="250" stroke="#9aa0a6" stroke-width="1"/>
  <line x1="90" y1="250" x2="620" y2="250" stroke="#9aa0a6" stroke-width="1"/>
  <g font-size="10" fill="#9aa0a6" text-anchor="middle">
    <text x="90" y="268">0</text><text x="222" y="268">1000</text><text x="355" y="268">2000</text><text x="487" y="268">3000</text><text x="620" y="268">4000</text>
  </g>
  <text x="355" y="290" font-size="12" fill="#5f6368" text-anchor="middle">training step</text>
  <text x="20" y="160" font-size="12" fill="#5f6368" transform="rotate(-90 20 160)" text-anchor="middle">loss (log)</text>

  <!-- loss polyline -->
  <polyline fill="none" stroke="#1a73e8" stroke-width="2.5"
    points="90.1,87.4 96.6,166.7 116.5,191.5 156.2,199.3 222.5,200.1 355,213.9 487.5,218.8 620,223.6"/>
  <!-- points -->
  <g fill="#1a73e8">
    <circle cx="90.1" cy="87.4" r="3.5"/><circle cx="96.6" cy="166.7" r="3"/><circle cx="116.5" cy="191.5" r="3"/>
    <circle cx="156.2" cy="199.3" r="3"/><circle cx="222.5" cy="200.1" r="3"/><circle cx="355" cy="213.9" r="3"/>
    <circle cx="487.5" cy="218.8" r="3"/><circle cx="620" cy="223.6" r="4" fill="#188038"/>
  </g>
  <!-- endpoint annotations -->
  <text x="102" y="84" font-size="11" font-weight="700" fill="#c5221f">step 1: 262.95</text>
  <text x="616" y="216" font-size="11" font-weight="700" fill="#188038" text-anchor="end">step 4000: 0.0076</text>
  <text x="150" y="313" font-size="11" fill="#5f6368">Genuine convergence across ~4.5 decades — the loss curve every earlier lab faked with a fixed synthetic tensor, now real.</text>
</svg>

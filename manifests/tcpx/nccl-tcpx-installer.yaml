# manifests/tcpx/nccl-tcpx-installer.yaml
# Installs the GPUDirect-TCPX NCCL plugin + the receive-datapath binaries onto each A3 High
# node, into a hostPath the workload mounts. This is the GKE-published recipe; the installer
# image tag moves between GKE minor versions — RE-PIN IT at run time from the current GKE docs
# ("Maximize GPU network bandwidth with GPUDirect-TCPX").
#
# APPLIED LIVE on cluster hypercomputer-a3-tcpx (asia-east1-c), 2026-07-31 — this is the
# exact DaemonSet that produced this guide's measured TCPX result. BOTH image tags below
# differ from what the GKE docs currently show, each for its own reason (G27, G29). Read
# the comments before "modernising" either one.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nccl-tcpx-installer
  namespace: kube-system
  labels:
    k8s-app: nccl-tcpx-installer
spec:
  selector:
    matchLabels:
      k8s-app: nccl-tcpx-installer
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nccl-tcpx-installer
        k8s-app: nccl-tcpx-installer
    spec:
      priorityClassName: system-node-critical
      # Only land on the TCPX A3 pool.
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-80gb
      tolerations:
        - operator: Exists
      hostNetwork: true
      hostPID: true
      volumes:
        - name: var-lib
          hostPath:
            path: /var/lib
        - name: tcpx
          hostPath:
            path: /var/lib/tcpx
        - name: library-dir-host
          hostPath:
            path: /home/kubernetes/bin/nvidia/lib64
      initContainers:
        - name: nccl-tcpx-installer
          # DO NOT USE `:latest` HERE. On this tier `:latest` still resolves to the v3.1.9
          # line (built 2023), which is incompatible with the R580 open kernel module that
          # ships on current GKE A3 High nodes: GPU memory registration fails outright
          # (`ioctl get dma_buf frags: Inappropriate ioctl for device` -> `gpu_tx_reg_mr
          # failed -5` -> Connect res=3) and NCCL aborts. It is a HARD failure, not a
          # silent socket fallback. v3.1.12 (2026-05-08) fixes it. Note that the registry's
          # `tags/list` endpoint does NOT show v3.1.10+ — find newer builds with
          #   gcloud artifacts docker images list \
          #     us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpx/nccl-plugin-gpudirecttcpx-dev \
          #     --include-tags --sort-by=~CREATE_TIME
          # See G29 and assets/lab-18/tcpx_failure_dmabuf_regmr.txt.
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpx/nccl-plugin-gpudirecttcpx-dev:v3.1.12
          resources:
            requests:
              cpu: 150m
          securityContext:
            privileged: true
          volumeMounts:
            - name: var-lib
              mountPath: /var/lib
            - name: tcpx
              mountPath: /var/lib/tcpx
            - name: library-dir-host
              mountPath: /usr/local/nvidia/lib64
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex
              /scripts/container_entry.sh install --install-nccl
              cp -r /var/lib/tcpx/lib64/. /usr/local/nvidia/lib64
      containers:
        # The sleeper that keeps the DaemonSet Pod alive after the initContainer has
        # installed the plugin. Pinned to the SAME digest the TCPXO installer uses
        # (nccl-tcpxo-installer.yaml): `gcr.io/google-containers/pause:3.9` — which the
        # GKE TCPX docs still show — 404s on that registry path, so the Pod sits in
        # ImagePullBackOff forever and the DaemonSet never reports Ready even though the
        # plugin libraries are already on the node. See G27.
        - name: pause
          image: "gke.gcr.io/pause:3.8@sha256:880e63f94b145e46f1b1082bb71b85e21f16b99b180b9996407d61240ceb9830"
          resources:
            requests:
              cpu: 10m
---
# tcpx-daemon: the receive-datapath manager (runs alongside the workload; also GKE-published).
# In the standard recipe this is added as a *sidecar* to the GPU workload Pod (see
# workbench-tcpx.yaml) rather than a DaemonSet, so it shares the Pod's network namespace.

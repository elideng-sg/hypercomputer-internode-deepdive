# lab-10 fault (a) signature #2: raw Pods (no gang controller) so killing one rank
# leaves the survivors to hit NCCL's own collective-timeout watchdog. 4x1 GPU on hhp6.
apiVersion: v1
kind: Service
metadata: {name: nccl-hang, namespace: default}
spec:
  clusterIP: None
  selector: {app: nccl-hang}
  ports: [{name: c10d, port: 29500}]
---
apiVersion: v1
kind: Pod
metadata:
  name: nccl-hang-0
  namespace: default
  labels: {app: nccl-hang}
spec:
  hostname: nccl-hang-0
  subdomain: nccl-hang
  restartPolicy: Never
  nodeSelector: {cloud.google.com/gke-nodepool: a3-h100-dws-pool}
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  - {key: cloud.google.com/gke-queued, operator: Exists, effect: NoSchedule}
  containers:
  - name: worker
    image: nvcr.io/nvidia/pytorch:24.10-py3
    env:
    - {name: NCCL_DEBUG, value: "INFO"}
    - {name: MASTER_ADDR, value: "nccl-hang-0.nccl-hang"}
    - {name: MASTER_PORT, value: "29500"}
    - {name: WORLD_SIZE, value: "4"}
    - {name: RANK, value: "0"}
    command: ["bash","-lc"]
    args:
    - |
      for i in $(seq 1 90); do getent hosts "$MASTER_ADDR" && break; sleep 2; done
      python -c "import torch,torch.distributed as dist,datetime,time; dist.init_process_group('nccl',timeout=datetime.timedelta(seconds=60)); r=dist.get_rank(); torch.cuda.set_device(0); t=torch.ones(268435456,device='cuda'); [ (dist.all_reduce(t), torch.cuda.synchronize(), print(f'rank {r} iter {k} ok value={t[0].item():.0f}',flush=True), t.fill_(1.0), time.sleep(3)) for k in range(200) ]"
    resources: {limits: {nvidia.com/gpu: 1}}
---

# lab-08: a JobSet demonstrating the replicated-job model + headless-service
# pod-DNS rendezvous, admitted through Kueue's gpu-lq (queue-name label).
# Four job replicas ("worker"), one pod / one GPU each = 4 GPUs total, which
# exactly matches the ClusterQueue quota and fits inside hhp6's free capacity
# (the DWS-held node is never touched). Each pod is one NCCL rank; ranks
# rendezvous over the JobSet headless service using stable pod DNS.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: nccl-jobset
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: gpu-lq     # Kueue admits the whole JobSet as one Workload
spec:
  replicatedJobs:
  - name: worker
    replicas: 4                            # four Jobs -> stable DNS indices 0..3
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-nodepool: a3-h100-dws-pool
            tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
            - key: cloud.google.com/gke-queued
              operator: Exists
              effect: NoSchedule
            containers:
            - name: worker
              image: nvcr.io/nvidia/pytorch:24.10-py3
              env:
              - name: NCCL_DEBUG
                value: "WARN"
              command:
              - bash
              - -lc
              - |
                set -e
                export MASTER_ADDR="nccl-jobset-worker-0-0.nccl-jobset"
                export MASTER_PORT=29500
                export WORLD_SIZE=4
                export RANK=$(hostname | sed -E 's/.*worker-([0-9]+)-[0-9]+$/\1/')
                echo "host=$(hostname) RANK=${RANK} MASTER=${MASTER_ADDR}"
                for i in $(seq 1 90); do getent hosts "$MASTER_ADDR" && break; echo "waiting for master DNS ($i)"; sleep 2; done
                python -c "import torch,torch.distributed as dist,datetime; dist.init_process_group('nccl',timeout=datetime.timedelta(seconds=180)); r=dist.get_rank(); w=dist.get_world_size(); torch.cuda.set_device(0); t=torch.ones(268435456,device='cuda'); torch.cuda.synchronize(); dist.all_reduce(t); torch.cuda.synchronize(); print(f'RANK {r}/{w} all_reduce done value={t[0].item():.1f} (expect {float(w)})'); dist.destroy_process_group()"
              resources:
                limits:
                  nvidia.com/gpu: 1

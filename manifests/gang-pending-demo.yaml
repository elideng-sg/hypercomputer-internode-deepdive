# A 2-replica indexed Job, each pod requesting a full 8-GPU node.
# On this cluster (one node held by a DWS holder, one partly used by vLLM)
# there are not 16 free GPUs, so BOTH pods stay Pending with a
# FailedScheduling / "Insufficient nvidia.com/gpu" event. It is submitted
# only to capture that scheduling gate, then deleted — it never runs and
# never preempts anything (no ProvisioningRequest, so it cannot scale the pool).
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-pending-demo
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: a3-h100-dws-pool
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Exists
        effect: NoSchedule
      containers:
      - name: worker
        image: nvcr.io/nvidia/pytorch:24.10-py3
        command: ["bash", "-c", "echo rank $JOB_COMPLETION_INDEX on $(hostname); sleep 30"]
        resources:
          limits:
            nvidia.com/gpu: 8

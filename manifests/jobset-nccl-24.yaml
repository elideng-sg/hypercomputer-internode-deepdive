# lab-13a: a 24-GPU / 3-node GANG, admitted as ONE Kueue Workload.
#
# Three replicated Jobs ("worker"), one pod each requesting a WHOLE node's
# 8 GPUs -> the three pods can only land one-per-node, so the JobSet spans all
# three nodes (24 ranks). Kueue admits the entire JobSet atomically (gang): all
# 24 GPUs of quota are reserved together or the workload waits. Each pod then
# launches 8 local ranks (manual RANK/WORLD_SIZE env — the same c10d bypass
# lab-06/12/13b use, avoiding torchrun's fragile multi-pod rendezvous). Ranks
# rendezvous on the JobSet headless service via stable pod DNS.
#
# WHY 3 NODES: a *non-power-of-two* gang (24) that must be placed across three
# nodes at once — a 2-node/16-GPU pool cannot express either the 24-way gang or
# the 3-node all-or-nothing placement.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: nccl-gang
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: gpu-lq-24     # Kueue admits the whole JobSet as one Workload
spec:
  replicatedJobs:
  - name: worker
    replicas: 3                              # three Jobs -> stable DNS indices 0..2, one per node
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: a3-high-flex-pool
            tolerations:
            - operator: Exists
            containers:
            - name: worker
              image: nvcr.io/nvidia/pytorch:24.10-py3
              securityContext:
                capabilities:
                  add: ["IPC_LOCK"]
              env:
              # hostNetwork:true makes `hostname` return the NODE name, not the
              # pod name — so we recover this replica's node-rank from the
              # JobSet-injected job-index annotation (robust), with a pod-name
              # parse as fallback. Pod names carry a random suffix
              # (nccl-gang-worker-<replica>-<completion>-<rand>), so an
              # end-anchored digit regex on the name alone is NOT reliable.
              - name: JOB_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['jobset.sigs.k8s.io/job-index']
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NCCL_SOCKET_IFNAME
                value: "eth0"
              - name: NCCL_DEBUG
                value: "WARN"
              command:
              - bash
              - -lc
              - |
                set -e
                NODE_RANK="${JOB_INDEX}"
                [[ "$NODE_RANK" =~ ^[0-9]+$ ]] || NODE_RANK=$(echo "$POD_NAME" | sed -E 's/.*worker-([0-9]+)-[0-9]+-[a-z0-9]+$/\1/')
                [[ "$NODE_RANK" =~ ^[0-9]+$ ]] || { echo "FATAL: cannot derive NODE_RANK (POD_NAME=$POD_NAME JOB_INDEX=$JOB_INDEX)"; exit 1; }
                export MASTER_ADDR="nccl-gang-worker-0-0.nccl-gang"
                export MASTER_PORT=29500
                export WORLD_SIZE=24
                echo "host=$(hostname) node_rank=${NODE_RANK} master=${MASTER_ADDR} world=${WORLD_SIZE}"
                for i in $(seq 1 120); do getent hosts "$MASTER_ADDR" >/dev/null && break; echo "waiting for master DNS ($i)"; sleep 2; done
                cat >/tmp/ar.py <<'PY'
                import os, datetime, torch, torch.distributed as dist
                r = int(os.environ["RANK"]); lr = int(os.environ["LOCAL_RANK"]); w = int(os.environ["WORLD_SIZE"])
                torch.cuda.set_device(lr)
                dist.init_process_group("nccl", timeout=datetime.timedelta(seconds=300))
                t = torch.ones(268435456, device="cuda"); torch.cuda.synchronize()   # 1 GiB fp32
                dist.all_reduce(t); torch.cuda.synchronize()
                if r == 0:
                    print(f"GANG all_reduce OK value={t[0].item():.1f} (expect {float(w)}) world_size={w}", flush=True)
                dist.destroy_process_group()
                PY
                pids=()
                for i in $(seq 0 7); do
                  RANK=$((NODE_RANK * 8 + i)) LOCAL_RANK=$i python /tmp/ar.py &
                  pids+=($!)
                done
                rc=0; for p in "${pids[@]}"; do wait "$p" || rc=1; done
                echo "node_rank=${NODE_RANK} done rc=${rc}"
                exit $rc
              resources:
                limits:
                  nvidia.com/gpu: 8
                requests:
                  cpu: "8"
                  memory: "32Gi"
              volumeMounts:
              - name: dshm
                mountPath: /dev/shm
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi

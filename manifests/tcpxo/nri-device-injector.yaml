# manifests/tcpxo/nri-device-injector.yaml
#
# The SECOND HALF of the GPUDirect-TCPXO install. Applying the NCCL TCPXO installer
# without this DaemonSet produces a fabric that passes every configuration check and
# cannot move a byte — see nccl-tcpxo-installer.yaml and playbook §4.10.
#
# WHAT IT DOES
# ------------
# The installer creates /dev/dmabuf_import_helper and /dev/aperture_devices/<BDF> on
# the NODE. The rxdm sidecar runs in a CONTAINER and, by default, sees neither. This
# NRI (Node Resource Interface) plugin watches Pod admission and injects device nodes
# named in the Pod annotation:
#
#   metadata:
#     annotations:
#       devices.gke.io/container.tcpxo-daemon: |+
#         - path: /dev/nvidia0        # ... through /dev/nvidia7
#         - path: /dev/nvidiactl
#         - path: /dev/nvidia-uvm
#         - path: /dev/dmabuf_import_helper
#
# The annotation KEY names the target container (`tcpxo-daemon`). Without the injector
# the annotation is inert — nothing errors, and the sidecar dies with
# CUDA_ERROR_NO_DEVICE or the dmabuf-importer failure.
#
# Taken verbatim from GoogleCloudPlatform/container-engine-accelerators
# (nri_device_injector/nri-device-injector.yaml). The stale MIG/driver-450 comment in
# the upstream header is upstream's, not ours — the image is the NRI device injector.
#
#   kubectl apply -f manifests/tcpxo/nri-device-injector.yaml
#   kubectl -n kube-system get ds device-injector      # want 1/1 per GPU node
#
# VERIFIED LIVE 2026-07-28 on `hypercomputer-a3-tcpxo`: 1/1 Ready; the rxdm sidecar
# received 8 GPUs + the dmabuf helper; NCCL selected NET/FasTrak on all 16 ranks.

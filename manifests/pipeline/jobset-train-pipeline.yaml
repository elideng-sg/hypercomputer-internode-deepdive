# lab-20: the end-to-end training PIPELINE as ONE gang — 2 nodes / 16 GPUs.
#
# This is lab-13's JobSet gang (manual ranks, headless-DNS rendezvous, Kueue
# atomic admission) with the THREE production pieces the earlier labs faked:
#   1. DATA from GCS   — the bucket is mounted in-pod (userspace GCSFuse, G20-safe)
#   2. CODE from GCS   — train_pipeline.py is read from gs://…/code (staged by run_pipeline.sh)
#   3. CHECKPOINTS to GCS — rank 0 writes state-dicts back through the same mount
# so the job trains on a real object store the way a production JobSet does, and
# the loss genuinely decreases (learnable data: y = X·w* + b* + noise).
#
# WHY 2 NODES / 16 GPUs: a training PIPELINE only exists across the wire — the
# gradient all-reduce that couples ranks each step, the shared dataset read by
# every node, and the checkpoint one rank writes for all are all multi-node
# behaviours. A single node (8 GPUs) has no inter-node all-reduce and no shared
# read fan-out; one GPU has no pipeline at all. 16 GPUs on 2 nodes is the
# smallest thing that is genuinely distributed end-to-end.
#
# AUTH / userspace GCSFuse (gotcha G20): the managed GCSFuse CSI driver needs
# Workload Identity at the NODE level (workloadMetadataConfig=GKE_METADATA), and
# switching that on this pre-WIF Flex pool RECREATES nodes — unsafe for scarce
# Flex A3 capacity. So each worker mounts GCSFuse in userspace (privileged +
# /dev/fuse), authenticated by the lab19-gcs-key GSA-key Secret. Zero node changes.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: train-pipeline
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: gpu-lq-24     # Kueue admits the whole 16-GPU JobSet atomically (gang)
spec:
  replicatedJobs:
  - name: worker
    replicas: 2                              # two Jobs -> stable DNS indices 0..1, one per node
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            hostNetwork: true                # inter-node NCCL over the node NIC (as lab-13)
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: a3-high-flex-pool
            tolerations:
            - operator: Exists
            containers:
            - name: worker
              image: nvcr.io/nvidia/pytorch:24.10-py3
              securityContext:
                privileged: true             # userspace FUSE mount needs /dev/fuse + CAP_SYS_ADMIN
              env:
              - name: JOB_INDEX              # this replica's node-rank (robust under hostNetwork)
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['jobset.sigs.k8s.io/job-index']
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: GOOGLE_APPLICATION_CREDENTIALS
                value: /var/secrets/key.json
              - name: BUCKET
                value: hdlab-elideng-lab-data-asiaeast1
              - name: NCCL_SOCKET_IFNAME
                value: "eth0"
              - name: NCCL_DEBUG
                value: "WARN"
              - name: STEPS
                value: "4000"                # long enough that GMP's ~30s scrape sees a clear engine-active plateau
              - name: BATCH
                value: "8192"
              - name: CKPT_EVERY
                value: "1000"
              command:
              - bash
              - -lc
              - |
                set -e
                # --- 1. mount the bucket in userspace (data + code + checkpoints) ---
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq >/dev/null 2>&1
                apt-get install -y -qq lsb-release curl gnupg fuse >/dev/null 2>&1
                echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt gcsfuse-$(lsb_release -c -s) main" > /etc/apt/sources.list.d/gcsfuse.list
                curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg 2>/dev/null
                apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq gcsfuse >/dev/null 2>&1
                mkdir -p /data && gcsfuse --implicit-dirs "$BUCKET" /data
                echo "host=$(hostname) mounted gs://$BUCKET at /data ; train shards: $(ls /data/train/train_*.npz | wc -l)"
                # --- 2. derive node-rank, set up rendezvous (headless JobSet DNS) ---
                NODE_RANK="${JOB_INDEX}"
                [[ "$NODE_RANK" =~ ^[0-9]+$ ]] || NODE_RANK=$(echo "$POD_NAME" | sed -E 's/.*worker-([0-9]+)-[0-9]+-[a-z0-9]+$/\1/')
                [[ "$NODE_RANK" =~ ^[0-9]+$ ]] || { echo "FATAL: cannot derive NODE_RANK (POD=$POD_NAME JOB_INDEX=$JOB_INDEX)"; exit 1; }
                export MASTER_ADDR="train-pipeline-worker-0-0.train-pipeline"
                export MASTER_PORT=29500
                export WORLD_SIZE=16
                export DATA_DIR=/data/train
                export CKPT_DIR=/data/checkpoints/pipeline
                echo "host=$(hostname) node_rank=${NODE_RANK} master=${MASTER_ADDR} world=${WORLD_SIZE}"
                for i in $(seq 1 120); do getent hosts "$MASTER_ADDR" >/dev/null && break; echo "waiting for master DNS ($i)"; sleep 2; done
                # --- 3. launch 8 local ranks; each runs the code READ FROM GCS -----
                pids=()
                for i in $(seq 0 7); do
                  RANK=$((NODE_RANK * 8 + i)) LOCAL_RANK=$i python3 /data/code/train_pipeline.py &
                  pids+=($!)
                done
                rc=0; for p in "${pids[@]}"; do wait "$p" || rc=1; done
                echo "node_rank=${NODE_RANK} done rc=${rc}"
                exit $rc
              resources:
                limits:
                  nvidia.com/gpu: 8
                requests:
                  cpu: "8"
                  memory: "32Gi"
              volumeMounts:
              - { name: key,  mountPath: /var/secrets, readOnly: true }
              - { name: fuse, mountPath: /dev/fuse }
              - { name: dshm, mountPath: /dev/shm }
            volumes:
            - { name: key,  secret: { secretName: lab19-gcs-key } }
            - { name: fuse, hostPath: { path: /dev/fuse } }
            - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
